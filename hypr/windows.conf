# Global defaults. These must stay above the per-app rules below: Hyprland applies
# matching windowrules in order, so the later "tile on" rules override the blanket float.

# Open new windows floating instead of tiled
windowrule = float on, match:class .*

# No transparency. Overrides Omarchy's "opacity 0.985 0.96" on the default-opacity tag.
windowrule = opacity 1 1, match:class .*

# Place chat apps on workspace 1 and keep them tiled

# Discord family (Discord, Vesktop, WebCord; Flatpak uses same classes) - workspace 2
windowrule = tile on, match:class ^(discord|vesktop|webcord)$
windowrule = workspace 2 silent, match:class ^(discord|vesktop|webcord)$

# Telegram (native / Flatpak) - workspace 2
windowrule = tile on, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$
windowrule = workspace 2 silent, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$
# Telegram's image viewer is a separate window with the SAME class, so the rule
# above tiles it too, and Hyprland's group:auto_group=1 then absorbs it into
# Telegram's group. Fullscreening a picture and closing it leaves the surviving
# group member (the chat window) stuck fullscreen. "barred" blocks only the
# automatic grouping — Super+G still groups Telegram manually.
windowrule = group barred, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$

# Telegram image viewer: float it and fit it to the workspace instead of letting
# it tile. Must stay AFTER the "tile on" rule above so it wins. Matched by title
# because the viewer shares the chat window's class; "Media viewer" is the
# English-UI title, so this stops matching if the Telegram UI language changes.
windowrule = float on, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$, match:title ^(Media viewer)$
# Absolute pixels, not "90% 90%": percentage sizes are silently ignored by this
# Hyprland (0.56.1) with the match: rule syntax — verified, absolute values work.
# 1440x900 is 90% of this display's 1600x1000 logical area (2560x1600 @ scale 1.6),
# so it needs adjusting for a differently sized monitor.
windowrule = size 1440 900, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$, match:title ^(Media viewer)$
windowrule = center on, match:class ^(org\.telegram\.desktop|telegram-desktop|TelegramDesktop)$, match:title ^(Media viewer)$

# WhatsApp - Whatsie (actual class is com.ktechpit.whatsie)
windowrule = tile on, match:class ^(com\.ktechpit\.whatsie)$
windowrule = workspace 1 silent, match:class ^(com\.ktechpit\.whatsie)$

# WhatsApp - Linux Desktop (class is "WhatsApp Desktop")
windowrule = tile on, match:class ^(WhatsApp Desktop)$
windowrule = workspace 1 silent, match:class ^(WhatsApp Desktop)$

# Viber
windowrule = tile on, match:class ^(Viber|viber)$
windowrule = workspace 2 silent, match:class ^(Viber|viber)$

# Last War on workspace 5 (tiled)
windowrule = tile on, match:title ^(Last War-Survival Game)$
windowrule = workspace 5 silent, match:title ^(Last War-Survival Game)$
windowrule = tile on, match:class ^(steam_proton)$, match:title Last War
windowrule = workspace 5 silent, match:class ^(steam_proton)$, match:title Last War

# Xclicker on workspace 15
windowrule = workspace 15 silent, match:class ^(xclicker)$

# Last War auxiliary window (empty title) on workspace 15 with xclicker
windowrule = workspace 15 silent, match:class ^(steam_proton)$, match:title ^$

# Hide the LastWar launcher (keeps respawning, can't be closed)
# windowrule = size 1 1, match:class ^(steam_proton)$, match:title ^(Launcher - Iced)$
# windowrule = move -100 -100, match:class ^(steam_proton)$, match:title ^(Launcher - Iced)$

# Performance optimizations for games (steam_proton)
windowrule = no_blur on, match:class ^(steam_proton)$
windowrule = no_shadow on, match:class ^(steam_proton)$
windowrule = opacity 1.0 1.0, match:class ^(steam_proton)$
